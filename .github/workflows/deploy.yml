name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      - name: Prepare Vercel static deployment compatibility for gh-pages branch
        run: |
          node -e 'fs.writeFileSync("dist/package.json", JSON.stringify({ name: "campus-waste-static", private: true, scripts: { build: "echo static release ready" } }, null, 2))'
          node -e 'fs.writeFileSync("dist/vercel.json", JSON.stringify({ cleanUrls: true, rewrites: [{ source: "/(.*)", destination: "/index.html" }] }, null, 2))'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

